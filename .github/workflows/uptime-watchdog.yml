name: Uptime watchdog
# Off-Mac check of the public site, for when the Mac is down (power cut + FileVault = nothing runs).
# Public repo, so Actions minutes are free. Alerts go to ntfy; skipped quietly if NTFY_TOPIC is unset.
# De-dup: alert only when the previous finished run was green; send "recovered" when it was red.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      web_url:
        description: "Override the web URL (use a bad one to test the alert)"
        required: false
      api_url:
        description: "Override the API health URL"
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: uptime-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      WEB_URL: ${{ inputs.web_url || 'https://seans-mac-mini.tailc9e7f8.ts.net/' }}
      API_URL: ${{ inputs.api_url || 'https://seans-mac-mini.tailc9e7f8.ts.net:8443/health' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Probe
        id: probe
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret not set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fails=""
          for pair in "web=$WEB_URL" "api=$API_URL"; do
            name="${pair%%=*}"; url="${pair#*=}"
            if ! curl -fsS -o /dev/null --max-time 15 --retry 3 --retry-delay 10 --retry-all-errors "$url"; then
              fails="$fails $name"
            fi
          done
          echo "fails=${fails# }" >> "$GITHUB_OUTPUT"
          [ -z "$fails" ] || echo "Down:$fails"
      - name: Notify on change
        if: steps.probe.outputs.skip != 'true'
        env:
          FAILS: ${{ steps.probe.outputs.fails }}
        run: |
          # conclusion of the most recent finished run of this workflow (this run is still in progress)
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow uptime-watchdog.yml --status completed \
                   --limit 10 --json conclusion --jq '[.[] | select(.conclusion=="success" or .conclusion=="failure")][0].conclusion // "success"')
          echo "previous: $prev, down now: '${FAILS}'"
          if [ -n "$FAILS" ] && [ "$prev" != "failure" ]; then
            curl -fsS --max-time 15 -H "Title: FlyRely is DOWN" -H "Priority: high" -H "Tags: rotating_light" \
              -d "Public check failed from GitHub Actions: ${FAILS}. The Mac may be off, locked at the FileVault screen, or Tailscale Funnel is down." \
              "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          elif [ -z "$FAILS" ] && [ "$prev" = "failure" ]; then
            curl -fsS --max-time 15 -H "Title: FlyRely recovered" -H "Tags: white_check_mark" \
              -d "Public web and API checks are passing again." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
      - name: Fail the run if down (this is the dedup marker)
        if: steps.probe.outputs.fails != ''
        run: exit 1
